[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "episodic-consolidation-worker"
version = "0.1.0"
description = "Asynchronous consolidation worker clustering raw episodic experiences into reusable declarative schemata"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
episodic-consolidation-worker = "episodic_consolidation_worker.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["episodic_consolidation_worker*"]
